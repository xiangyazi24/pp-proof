name: Q10181 primary result collector

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/q10181-primary-collect-temp.yml

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads flat
          for name in q10181-case-2-3-90 q10181-case-2-3-95 q10181-case-3-3-90 q10181-case-3-3-95; do
            gh run download 44867628820 -n "$name" -D "downloads/$name"
          done
          find downloads -name '*.json' -exec cp {} flat/ \;
          python q10181/run.py summarize flat q10181/primary-summary.json q10181/primary-report.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q10181/primary-summary.json q10181/primary-report.txt
          git commit -m 'Add primary Q10181 numerical results [skip ci]'
          git push origin HEAD:main
