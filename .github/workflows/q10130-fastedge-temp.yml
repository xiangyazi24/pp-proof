name: Q10130 fast corrected edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q10130-fastedge-temp.yml'

permissions:
  contents: write

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: |
          curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/run.py -o /tmp/run.py
          curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/fastedge.py -o /tmp/fastedge.py
          mkdir -p q10130
          cd /tmp
          python fastedge.py "$GITHUB_WORKSPACE/q10130/fast-edge.json"
          cat "$GITHUB_WORKSPACE/q10130/fast-edge.json"
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add q10130/fast-edge.json
          git commit -m 'Record Q10130 corrected empirical edge'
          git push origin HEAD:main
