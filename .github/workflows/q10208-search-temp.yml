name: Q10208 guarded-network search
on:
  push:
    branches: [main]
    paths:
      - q10208/search.py
      - .github/workflows/q10208-search-temp.yml
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
jobs:
  search:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        job: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: |
          mkdir -p results
          python q10208/search.py '${{ matrix.job }}' 100 'results/job-${{ matrix.job }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: q10208-search-${{ matrix.job }}
          path: results/job-${{ matrix.job }}.json
          retention-days: 2
# trigger
