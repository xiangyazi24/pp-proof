name: Q10181 corrected primary numerics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/q10181-v2-temp.yml

permissions:
  contents: write

env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1

jobs:
  cases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {k: 2, ratio: '0.90', tag: '2-90'}
          - {k: 2, ratio: '0.95', tag: '2-95'}
          - {k: 3, ratio: '0.90', tag: '3-90'}
          - {k: 3, ratio: '0.95', tag: '3-95'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: |
          mkdir -p results
          python q10181/run_v2.py case '${{ matrix.k }}' '1e-3' '${{ matrix.ratio }}' 'results/case-${{ matrix.tag }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: q10181v2-${{ matrix.tag }}
          path: results/case-${{ matrix.tag }}.json
          retention-days: 2

  collect:
    runs-on: ubuntu-latest
    needs: cases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: q10181v2-*
          path: results
          merge-multiple: true
      - run: python q10181/run_v2.py summarize results q10181/v2-summary.json q10181/v2-report.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q10181/v2-summary.json q10181/v2-report.txt
          git commit -m 'Add corrected Q10181 numerical results [skip ci]'
          git push origin HEAD:main

# rerun after import-path correction
